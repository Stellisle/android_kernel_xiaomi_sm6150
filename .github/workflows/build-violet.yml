cat > /tmp/build-violet.yml <<'YAML'
name: Build Violet Kernel (sm6150)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Stellisle/android_kernel_xiaomi_sm6150
          ref: lineage-23.2
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev \
            libncurses5-dev zip libelf-dev dwarves git gcc-aarch64-linux-gnu

      - name: Download Clang r383902 (GitHub mirror)
        run: |
          git clone --depth=1 \
            https://github.com/picasso09/clang-11.0.1-r383902.git \
            $HOME/clang
          $HOME/clang/bin/clang --version

      - name: Build kernel
        working-directory: kernel
        run: |
          # 1. 修复 trace_event_perf.c 重复声明
          if [ "$(sed -n '431p' kernel/trace/trace_event_perf.c)" = "$(sed -n '433p' kernel/trace/trace_event_perf.c)" ]; then
            sed -i '433d' kernel/trace/trace_event_perf.c
            echo "已删除重复的 event 声明"
          else
            echo "431 和 433 行不一致"
            exit 1
          fi

          # 2. 补 WALT 缺失的 sysctl 变量定义
          if ! grep -q "sysctl_sched_conservative_pl" kernel/sched/fair.c; then
            sed -i 's|^    (10 \* NSEC_PER_MSEC);$|    (10 * NSEC_PER_MSEC);\nunsigned int sysctl_sched_conservative_pl = 1;\nunsigned int sysctl_sched_many_wakeup_threshold = 8;|' kernel/sched/fair.c
          fi
          grep -n "sysctl_sched_conservative_pl" kernel/sched/fair.c || exit 1

          export PATH=$HOME/clang/bin:$PATH
          export ARCH=arm64
          export LLVM=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out vendor/sdmsteppe_defconfig
          scripts/kconfig/merge_config.sh -O out out/.config \
            arch/arm64/configs/vendor/violet.config

          # 3. 关键配置：LOCALVERSION 对齐原厂 + APatch/Droidspaces + 修编译错误
          scripts/config --file out/.config \
            --set-str LOCALVERSION "-perf-ge03e5ba22586" \
            --disable LOCALVERSION_AUTO \
            --enable MACH_XIAOMI \
            --enable BUILD_ARM64_DT_OVERLAY \
            --enable MACH_XIAOMI_VIOLET \
            --enable ANDROID_VENDOR_HOOKS \
            --enable PID_NS \
            --enable USER_NS \
            --enable KPROBES \
            --enable KPROBE_EVENTS \
            --disable EFI \
            --disable EFI_STUB \
            --disable FAULT_INJECTION \
            --disable FAULT_INJECTION_DEBUG_FS \
            --disable FAILSLAB \
            --disable FAIL_PAGE_ALLOC

          make O=out olddefconfig

          echo "===== 关键配置确认 ====="
          grep -E "LOCALVERSION|MACH_XIAOMI|BUILD_ARM64_DT_OVERLAY|ANDROID_VENDOR_HOOKS|PID_NS|USER_NS|KPROBES|SCHED_WALT|EFI" out/.config

          echo "===== 开始编译内核 ====="
          make O=out -j$(nproc) KCFLAGS="-Wno-error" Image.gz

          echo "===== 版本字符串确认 ====="
          gunzip -c out/arch/arm64/boot/Image.gz | strings | grep -m1 "Linux version"

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p output
          cp kernel/out/arch/arm64/boot/Image.gz output/
          ls -lh output/
          echo "===== 内核版本 ====="
          gunzip -c output/Image.gz | strings | grep -m1 "Linux version"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-kernel
          path: output/
          if-no-files-found: error
YAML

REPO="Stellisle/android_kernel_xiaomi_sm6150"
BRANCH="lineage-23.2"
WF_PATH=".github/workflows/build-violet.yml"

SHA=$(gh api "repos/$REPO/contents/$WF_PATH?ref=$BRANCH" --jq .sha 2>/dev/null)
if [ -n "$SHA" ] && [ "$SHA" != "null" ]; then
  gh api -X PUT "repos/$REPO/contents/$WF_PATH" \
    -f message="Align LOCALVERSION with stock kernel (4.14.357-openela-perf-ge03e5ba22586)" \
    -f content="$(base64 < /tmp/build-violet.yml | tr -d '\n')" \
    -f sha="$SHA" -f branch="$BRANCH"
else
  gh api -X PUT "repos/$REPO/contents/$WF_PATH" \
    -f message="Add violet kernel build workflow" \
    -f content="$(base64 < /tmp/build-violet.yml | tr -d '\n')" \
    -f branch="$BRANCH"
fi

gh workflow run build-violet.yml --repo "$REPO" --ref "$BRANCH"
sleep 8
gh run list --repo "$REPO" --limit 3