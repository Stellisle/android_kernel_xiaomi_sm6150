name: Build Violet Kernel (sm6150)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Stellisle/android_kernel_xiaomi_sm6150
          ref: lineage-23.2
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev \
            libncurses5-dev zip libelf-dev dwarves git gcc-aarch64-linux-gnu

      - name: Download Clang r383902 (GitHub mirror)
        run: |
          git clone --depth=1 \
            https://github.com/picasso09/clang-11.0.1-r383902.git \
            $HOME/clang
          $HOME/clang/bin/clang --version

      - name: Build kernel
        working-directory: kernel
        run: |
          if [ "$(sed -n '431p' kernel/trace/trace_event_perf.c)" = "$(sed -n '433p' kernel/trace/trace_event_perf.c)" ]; then
            sed -i '433d' kernel/trace/trace_event_perf.c
            echo "已删除重复的 event 声明"
          else
            echo "431 和 433 行不一致，手动检查"
            exit 1
          fi

          if grep -q "sysctl_sched_conservative_pl" kernel/sched/fair.c; then
            echo "WALT sysctl 变量已存在"
          else
            sed -i 's|^    (10 \* NSEC_PER_MSEC);$|    (10 * NSEC_PER_MSEC);\nunsigned int sysctl_sched_conservative_pl = 1;\nunsigned int sysctl_sched_many_wakeup_threshold = 8;|' kernel/sched/fair.c
          fi
          grep -n "sysctl_sched_conservative_pl" kernel/sched/fair.c || exit 1

          # 给 violet 补主 dtb 编译规则
          MAKEFILE=arch/arm64/boot/dts/qcom/Makefile
          if grep -q "dtb-.*MACH_XIAOMI_VIOLET.*violet-sm6150.dtb" $MAKEFILE; then
            echo "主 dtb 规则已存在"
          else
            sed -i '/^dtbo-\$(CONFIG_MACH_XIAOMI_VIOLET) += violet-sm6150-overlay.dtbo$/i dtb-$(CONFIG_MACH_XIAOMI_VIOLET) += violet-sm6150.dtb' $MAKEFILE
            echo "已插入主 dtb 规则"
          fi
          grep -n "violet-sm6150" $MAKEFILE | head -10

          export PATH=$HOME/clang/bin:$PATH
          export ARCH=arm64
          export LLVM=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out vendor/sdmsteppe_defconfig
          scripts/kconfig/merge_config.sh -O out out/.config \
            arch/arm64/configs/vendor/violet.config
          scripts/config --file out/.config \
            --enable MACH_XIAOMI_VIOLET \
            --enable ANDROID_VENDOR_HOOKS \
            --enable PID_NS --enable USER_NS --enable KPROBES \
            --disable EFI \
            --disable EFI_STUB \
            --disable FAULT_INJECTION \
            --disable FAULT_INJECTION_DEBUG_FS \
            --disable FAILSLAB \
            --disable FAIL_PAGE_ALLOC
          make O=out olddefconfig
          grep -E "MACH_XIAOMI_VIOLET|ANDROID_VENDOR_HOOKS|PID_NS|USER_NS|KPROBES|SCHED_WALT" out/.config

          make O=out -j$(nproc) KCFLAGS="-Wno-error" Image.gz dtbs

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p output
          cp kernel/out/arch/arm64/boot/Image.gz output/
          echo "===== 所有 violet 相关产物 ====="
          find kernel/out/arch/arm64/boot/dts -name '*violet*' -exec ls -lh {} \;
          find kernel/out/arch/arm64/boot/dts -name 'violet-sm6150.dtb' -exec cp {} output/ \;
          find kernel/out/arch/arm64/boot/dts -name 'violet-sm6150-overlay.dtbo' -exec cp {} output/ \;
          echo "===== output 内容 ====="
          ls -lh output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-kernel
          path: output/
          if-no-files-found: error
