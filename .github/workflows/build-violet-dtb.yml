name: Build Violet dtb only

on:
  workflow_dispatch:
    inputs:
      image_run_id:
        description: 'Run ID of previous kernel build (for Image.gz)'
        required: true
        default: '40064402172'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Stellisle/android_kernel_xiaomi_sm6150
          ref: lineage-23.2
          path: kernel

      - name: Download previous Image.gz
        uses: actions/download-artifact@v4
        with:
          name: violet-kernel
          run-id: ${{ github.event.inputs.image_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prev

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev \
            libncurses5-dev zip libelf-dev dwarves git gcc-aarch64-linux-gnu

      - name: Download Clang r383902 (GitHub mirror)
        run: |
          git clone --depth=1 \
            https://github.com/picasso09/clang-11.0.1-r383902.git \
            $HOME/clang
          $HOME/clang/bin/clang --version

      - name: Build dtbs
        working-directory: kernel
        run: |
          if [ "$(sed -n '431p' kernel/trace/trace_event_perf.c)" = "$(sed -n '433p' kernel/trace/trace_event_perf.c)" ]; then
            sed -i '433d' kernel/trace/trace_event_perf.c
          fi
          if ! grep -q "sysctl_sched_conservative_pl" kernel/sched/fair.c; then
            sed -i 's|^    (10 \* NSEC_PER_MSEC);$|    (10 * NSEC_PER_MSEC);\nunsigned int sysctl_sched_conservative_pl = 1;\nunsigned int sysctl_sched_many_wakeup_threshold = 8;|' kernel/sched/fair.c
          fi
          grep -n "sysctl_sched_conservative_pl" kernel/sched/fair.c || exit 1

          MAKEFILE=arch/arm64/boot/dts/qcom/Makefile
          if ! grep -q "dtb-.*MACH_XIAOMI_VIOLET.*violet-sm6150.dtb" $MAKEFILE; then
            sed -i '/^dtbo-\$(CONFIG_MACH_XIAOMI_VIOLET) += violet-sm6150-overlay.dtbo$/i dtb-$(CONFIG_MACH_XIAOMI_VIOLET) += violet-sm6150.dtb' $MAKEFILE
          fi
          grep -n "violet-sm6150" $MAKEFILE | head -5

          export PATH=$HOME/clang/bin:$PATH
          export ARCH=arm64
          export LLVM=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out vendor/sdmsteppe_defconfig
          scripts/kconfig/merge_config.sh -O out out/.config \
            arch/arm64/configs/vendor/violet.config
          scripts/config --file out/.config \
            --enable MACH_XIAOMI \
            --enable BUILD_ARM64_DT_OVERLAY \
            --enable MACH_XIAOMI_VIOLET \
            --enable ANDROID_VENDOR_HOOKS \
            --enable PID_NS --enable USER_NS --enable KPROBES \
            --disable EFI --disable EFI_STUB \
            --disable FAULT_INJECTION --disable FAULT_INJECTION_DEBUG_FS \
            --disable FAILSLAB --disable FAIL_PAGE_ALLOC
          make O=out olddefconfig
          grep -E "MACH_XIAOMI=|BUILD_ARM64_DT_OVERLAY|MACH_XIAOMI_VIOLET" out/.config

          make O=out -j$(nproc) prepare
          make O=out -j$(nproc) KCFLAGS="-Wno-error" \
            qcom/violet-sm6150.dtb qcom/violet-sm6150-overlay.dtbo

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p output
          cp prev/Image.gz output/
          DTB_DIR=kernel/out/arch/arm64/boot/dts/qcom
          ls -lh $DTB_DIR/violet-sm6150.dtb $DTB_DIR/violet-sm6150-overlay.dtbo
          cp $DTB_DIR/violet-sm6150.dtb output/
          cp $DTB_DIR/violet-sm6150-overlay.dtbo output/
          ls -lh output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: violet-kernel-with-dtb
          path: output/
          if-no-files-found: error
